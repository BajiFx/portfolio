<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Same styles as before – keep them */
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <a href="#" class="logo">Dev<span>.</span></a>
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to manage your portfolio</p>
        <div id="loginError" class="login-error"><i class="fas fa-exclamation-circle"></i> <span id="errorMsg">Invalid username or password</span></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="username" placeholder="Enter username" required autofocus></div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="Enter password" required></div>
            </div>
            <button type="submit" class="btn primary btn-block"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>
        <a href="register.html" class="back-link"><i class="fas fa-user-plus"></i> Register as Admin</a>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
        <div class="login-footer">Secure admin login</div>
    </div>
</div>
<script>
    const API_BASE = 'https://portfolio-oqqu.onrender.com';

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('loginError');
        const errorMsg = document.getElementById('errorMsg');

        try {
            const res = await fetch(`${API_BASE}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'admin.html';
            } else {
                errorMsg.textContent = data.error || 'Login failed';
                errorDiv.classList.add('show');
                setTimeout(() => errorDiv.classList.remove('show'), 4000);
            }
        } catch (err) {
            errorMsg.textContent = 'Network error – check your connection.';
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 4000);
        }
    });
</script>
</body>
</html>
